# InnoMetrics social bot: every 10 minutes, handle Telegram button taps/replies and publish posts ok that are due.
# Captions and times are still written by the hourly Claude run (social/PLAYBOOK.md).
# Secrets: repository Settings -> Secrets and variables -> Actions.
name: Social bot (10-minute check)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:  # also called every 10 minutes by cron-job.org (GitHub's own timer is unreliable)
    inputs:
      force:
        description: "Run even during the hourly Claude run window (:39-:50)"
        type: boolean
        default: false

concurrency:
  group: social-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/multi-platform-content-upload-nk69sp
      - name: Video tools (fixes frame rates TikTok rejects)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Buttons, replies and due posts
        working-directory: social
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          PLATFORMS: ${{ vars.PLATFORMS }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: |
          # The hourly Claude run starts at :41; stay out of its way.
          m=$((10#$(date -u +%M)))
          if [ "${{ inputs.force }}" != true ] && [ "$m" -ge 39 ] && [ "$m" -le 50 ]; then echo "Hourly run window - skipping"; exit 0; fi
          # The repository is public: print only a summary, never the raw output.
          if python3 -m innosocial tick --quick > /tmp/tick.json 2> /tmp/err.txt; then
            python3 -c "import json; d=json.load(open('/tmp/tick.json')); print('published:', d['published'], '| errors:', len(d['errors']), '| waiting for a draft:', len(d['needs_draft']))"
          else
            echo "Check failed:"; tail -n 1 /tmp/err.txt | cut -c1-200; exit 1
          fi
