<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tektur;src:url(fonts/Tektur.ttf);font-weight:400 900;font-stretch:75% 100%}
@font-face{font-family:Play;src:url(fonts/Play-Regular.ttf);font-weight:400}
@font-face{font-family:Play;src:url(fonts/Play-Bold.ttf);font-weight:700}
@font-face{font-family:Michroma;src:url(fonts/Michroma.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,main=document.getElementById('c'),mx=main.getContext('2d');
let x=mx;
const A='#35d0ff',B='#8b5cff',C='#f046d6',FG='#f4f6fb',DIM='#9aa0b8';
const IMG={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.src=src})}
window.ready=Promise.all([load('front','front.png'),load('temple','temple.png'),load('logo','logo.png'),load('hero','hero.png'),load('pov','pov.jpg'),load('box','box.jpg'),
 document.fonts.load('800 40px Tektur'),document.fonts.load('600 40px Tektur'),document.fonts.load('400 40px Play'),document.fonts.load('700 40px Play'),document.fonts.load('40px Michroma')]);
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
const offA=mk(),offB=mk(),tmp=mk(),tmp2=mk(),small=mk(W/4,H/4);
// ---------- utils ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),P=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3),e4=p=>1-Math.pow(1-p,4),e5=p=>1-Math.pow(1-p,5),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,ei=p=>p*p*p;
const eexp=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
const back=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rnd(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+<>/';
function scr(str,p,seed){let r='';const n=str.length;for(let i=0;i<n;i++){const ch=str[i];r+=(ch===' '||i<p*n)?ch:GL[Math.floor(rnd(seed*31+i*7+Math.floor(p*40))*GL.length)]}return r}
function grad(x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,A);g.addColorStop(.5,B);g.addColorStop(1,C);return g}
function font(f,size,w=''){x.font=`${w} ${size}px ${f}`}
function txt(s,X,Y,f,size,o={}){x.save();font(f,size,o.w||'');x.textAlign=o.align||'center';x.letterSpacing=(o.ls||0)+'px';
 x.globalAlpha=o.a??1;x.fillStyle=o.col||FG;if(o.glow){x.shadowColor=o.glow;x.shadowBlur=o.gb||24}if(o.blur)x.filter=`blur(${o.blur}px)`;x.fillText(s,X,Y);x.restore()}
function fitSize(s,f,size,w,maxW,ls=0){font(f,size,w);x.letterSpacing=ls+'px';const m=x.measureText(s).width;return m>maxW?size*maxW/m:size}
function kick(s,Y,t,t0,col=A,size=24,X=540,align='center'){if(t<t0)return;const p=P(t,t0,t0+.6);
 txt(scr(s,p,Y),X,Y,'Michroma',size,{ls:size*.45,col,a:cl((t-t0)*3),glow:col,gb:12,align})}
// chars rising with mask (Tektur)
function rise(s,Y,t,t0,size,o={}){const f='Tektur',w=o.w||800;size=fitSize(s,f,size,w,o.maxW||980,0);font(f,size,w);x.letterSpacing='0px';
 const ls=o.ls??size*.02;const ws=[...s].map(ch=>x.measureText(ch).width+ls);const tot=ws.reduce((a,b)=>a+b,0)-ls;let X=(o.cx??540)-tot/2;
 x.save();x.beginPath();x.rect(0,Y-size*1.05,W,size*1.35);x.clip();
 [...s].forEach((ch,i)=>{const p=P(t,t0+i*.035,t0+i*.035+.55);if(p>0){const e=e5(p);x.save();x.translate(X+ws[i]/2,Y);x.globalAlpha=Math.min(1,e*1.4);
  font(f,size,w);x.textAlign='center';x.fillStyle=o.col||(o.g?grad(-tot/2+540-X-ws[i]/2,0,tot/2+540-X-ws[i]/2,0):FG);
  if(o.glow){x.shadowColor=o.glow;x.shadowBlur=30}x.fillText(ch,0,(1-e)*size*1.15);x.restore()}X+=ws[i]});x.restore()}
// slam word with colour bar
function slam(s,Y,t,t0,size,o={}){if(t<t0)return;const f='Tektur',w=o.w||800;size=fitSize(s,f,size,w,o.maxW||980,0);
 font(f,size,w);x.letterSpacing='0px';const tw=x.measureText(s).width;const X0=(o.cx??540)-tw/2-20,bw=tw+40,top=Y-size*.84,bh=size*1.0;
 const pb=P(t,t0,t0+.55),ps=P(t,t0+.24,t0+.7);
 if(ps>0){x.save();x.beginPath();x.rect(X0-10,top-20,bw+20,bh+40);x.clip();const k=e5(ps);
  x.translate(o.cx??540,Y+(1-k)*bh*1.05);x.scale(lerp(1.25,1,k),lerp(.75,1,k));x.textAlign='center';x.fillStyle=o.g?grad(-tw/2,0,tw/2,0):(o.col||FG);
  if(o.glow){x.shadowColor=o.glow;x.shadowBlur=36}x.fillText(s,0,0);x.restore()}
 if(pb>0&&pb<1){const q=eio(pb);let a0,a1;if(q<.5){a0=0;a1=q*2}else{a0=(q-.5)*2;a1=1}x.fillStyle=o.bar||C;x.fillRect(X0+bw*a0,top,bw*(a1-a0),bh)}}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function glass(X,Y,w,h,r,a=1,stroke='rgba(255,255,255,.22)'){x.save();x.globalAlpha=a;rr(X,Y,w,h,r);x.fillStyle='rgba(12,14,26,.55)';x.fill();x.strokeStyle=stroke;x.lineWidth=2;x.stroke();x.restore()}
function ring(cx,cy,r,a,col=A,lw=3){if(r<=0||a<=0)return;x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=lw;x.shadowColor=col;x.shadowBlur=18;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.restore()}
function drawPath(fn,p,col,lw=5){if(p<=0)return;x.save();x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor=col;x.shadowBlur=16;
 x.setLineDash([1000,1000]);x.lineDashOffset=1000*(1-p);x.beginPath();fn();x.stroke();x.restore()}
function brackets(x0,y0,x1,y1,L,col,lw=4,a=1){x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=lw;x.shadowColor=col;x.shadowBlur=12;x.lineCap='square';
 [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([px,py,dx,dy])=>{x.beginPath();x.moveTo(px,py+dy*L);x.lineTo(px,py);x.lineTo(px+dx*L,py);x.stroke()});x.restore()}
// handheld camera
function shake(t,amp=1){return [amp*(2.2*Math.sin(t*1.7)+1.3*Math.sin(t*3.1+1)+.6*Math.sin(t*7.3)),amp*(1.8*Math.sin(t*1.3+2)+1.1*Math.sin(t*2.7)+.5*Math.sin(t*6.1+3)),amp*.0012*Math.sin(t*1.1)]}

// ---------- photo with grade ----------
function photo(im,t,t0,t1,fx,fy,z0,z1,o={}){const s=Math.max(W/im.width,H/im.height);const iw=im.width*s,ih=im.height*s;
 const z=lerp(z0,z1,eio(P(t,t0,t1)));x.save();x.translate(fx,fy);x.scale(z,z);x.translate(-fx,-fy);
 x.filter=o.filter||'brightness(.62) contrast(1.18) saturate(.75)';x.drawImage(im,(W-iw)/2+(o.dx||0),(H-ih)/2,iw,ih);x.filter='none';x.restore();
 // split-tone grade
 x.save();x.globalCompositeOperation='soft-light';const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(53,208,255,.55)');g.addColorStop(.55,'rgba(40,30,120,.35)');g.addColorStop(1,'rgba(240,70,214,.55)');
 x.fillStyle=g;x.fillRect(0,0,W,H);x.restore()}

// ---------- realistic product stage ----------
function tint(im,w,h,col){tmp2.width=Math.ceil(w)+4;tmp2.height=Math.ceil(h)+4;const t2=tmp2.getContext('2d');t2.clearRect(0,0,tmp2.width,tmp2.height);t2.drawImage(im,2,2,w,h);
 t2.globalCompositeOperation='source-in';t2.fillStyle=col;t2.fillRect(0,0,tmp2.width,tmp2.height);t2.globalCompositeOperation='source-over';return tmp2}
function studio(t,floorY,hue=0){
 x.fillStyle='#04050a';x.fillRect(0,0,W,H);
 // key light cyclorama
 const g=x.createRadialGradient(540,floorY-260,40,540,floorY-200,980);g.addColorStop(0,'rgba(70,60,150,.55)');g.addColorStop(.45,'rgba(25,20,70,.4)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 // bokeh
 x.save();x.globalCompositeOperation='screen';for(let i=0;i<14;i++){const bx=(rnd(i+hue)*W+t*(8+rnd(i)*14))%(W+200)-100,by=200+rnd(i+40)*(floorY-260),br=30+rnd(i+9)*80;
  const col=[A,B,C][i%3];const bg=x.createRadialGradient(bx,by,0,bx,by,br);bg.addColorStop(0,col+'33');bg.addColorStop(.7,col+'22');bg.addColorStop(1,col+'00');x.fillStyle=bg;x.beginPath();x.arc(bx,by,br,0,7);x.fill()}x.restore();
 // light beams
 x.save();x.globalCompositeOperation='screen';for(let k=0;k<3;k++){const ang=-.35+k*.35+Math.sin(t*.3+k)*.04;x.save();x.translate(540+(k-1)*260,-100);x.rotate(ang);
  const bg=x.createLinearGradient(-80,0,80,0);bg.addColorStop(0,'rgba(120,140,255,0)');bg.addColorStop(.5,'rgba(120,140,255,.07)');bg.addColorStop(1,'rgba(120,140,255,0)');x.fillStyle=bg;x.fillRect(-80,0,160,floorY+200);x.restore()}x.restore();
 // glossy floor
 const fg=x.createLinearGradient(0,floorY,0,H);fg.addColorStop(0,'#0d0c1e');fg.addColorStop(.25,'#07070f');fg.addColorStop(1,'#020205');x.fillStyle=fg;x.fillRect(0,floorY,W,H-floorY);
 const hl=x.createLinearGradient(0,0,W,0);hl.addColorStop(0,'rgba(53,208,255,0)');hl.addColorStop(.5,'rgba(160,150,255,.55)');hl.addColorStop(1,'rgba(240,70,214,0)');x.fillStyle=hl;x.fillRect(0,floorY-1,W,2);
 const sp=x.createRadialGradient(540,floorY+40,0,540,floorY+40,520);sp.addColorStop(0,'rgba(120,110,255,.18)');sp.addColorStop(1,'rgba(0,0,0,0)');x.save();x.scale(1,.35);x.fillStyle=sp;x.fillRect(0,(floorY-200)/.35,W,900/.35);x.restore();
}
// product on floor: bb = content bbox in image px [x0,y0,x1,y1]
function product(im,bb,cx,floorY,w,t,o={}){const s=w/im.width,h=im.height*s;const turn=o.turn??(1-.07*(.5+.5*Math.sin(t*1.1)));const ww=w*turn;
 const lift=o.lift??(10+8*Math.sin(t*1.6));const bottom=floorY-lift;const top=bottom-bb[3]*s;const left=cx-ww/2;
 const a=o.a??1;if(a<=0)return{left,top,s,ww};x.save();x.globalAlpha=a;
 // reflection
 tmp.width=Math.ceil(ww);tmp.height=Math.ceil(bb[3]*s*.6);const tc=tmp.getContext('2d');tc.clearRect(0,0,tmp.width,tmp.height);tc.save();tc.translate(0,bb[3]*s);tc.scale(1,-1);tc.drawImage(im,0,0,ww,h);tc.restore();
 tc.globalCompositeOperation='destination-in';const rg=tc.createLinearGradient(0,(bb[3]-bb[3])*s,0,tmp.height);rg.addColorStop(0,'rgba(0,0,0,.42)');rg.addColorStop(.5,'rgba(0,0,0,.08)');rg.addColorStop(1,'rgba(0,0,0,0)');tc.fillStyle=rg;tc.fillRect(0,0,tmp.width,tmp.height);tc.globalCompositeOperation='source-over';
 x.save();x.filter='blur(2px)';x.drawImage(tmp,left,floorY+lift);x.restore();
 // contact shadow
 const cw=(bb[2]-bb[0])*s*turn;const sh=x.createRadialGradient(cx,floorY+4,0,cx,floorY+4,cw*.55);sh.addColorStop(0,`rgba(0,0,0,${.75-lift*.01})`);sh.addColorStop(1,'rgba(0,0,0,0)');
 x.save();x.translate(cx,floorY+4);x.scale(1,.09);x.translate(-cx,-(floorY+4));x.fillStyle=sh;x.beginPath();x.arc(cx,floorY+4,cw*.55,0,7);x.fill();x.restore();
 // rim lights (cyan left, magenta right)
 x.save();x.globalCompositeOperation='screen';x.filter='blur(7px)';x.globalAlpha=a*.85;
 x.drawImage(tint(im,ww,h,A),left-2-8,top-2-3);x.drawImage(tint(im,ww,h,C),left-2+8,top-2-3);x.restore();
 // product
 x.drawImage(im,left,top,ww,h);
 // top light falloff: darken bottom slightly
 // specular sweep
 const sw=o.sweep;if(sw>0&&sw<1){tmp.width=Math.ceil(ww);tmp.height=Math.ceil(h);const t3=tmp.getContext('2d');t3.clearRect(0,0,tmp.width,tmp.height);t3.drawImage(im,0,0,ww,h);
  t3.globalCompositeOperation='source-atop';const bx=lerp(-ww*.4,ww*1.4,eio(sw));const lg=t3.createLinearGradient(bx-120,0,bx+120,h*.35);lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.6)');lg.addColorStop(1,'rgba(255,255,255,0)');
  t3.fillStyle=lg;t3.fillRect(0,0,ww,h);x.globalCompositeOperation='screen';x.drawImage(tmp,left,top)}
 x.restore();return{left,top,s,ww,h}}

// ---------- tech background ----------
const grains=[];for(let g=0;g<6;g++){const gc=mk(540,960),gx=gc.getContext('2d');const d=gx.createImageData(540,960);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=22}gx.putImageData(d,0,0);grains.push(gc)}
function techbg(t,c1=A,c2=B){
 const rg=x.createRadialGradient(540,1950,0,540,1950,1700);rg.addColorStop(0,'#1b0b4a');rg.addColorStop(.55,'#08070f');rg.addColorStop(1,'#05060a');x.fillStyle=rg;x.fillRect(0,0,W,H);
 x.save();x.globalCompositeOperation='screen';const blob=(X,Y,r,col,a)=>{const g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,col+Math.round(a*255).toString(16).padStart(2,'0'));g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(0,0,W,H)};
 blob(180+80*Math.sin(t*.4),1450+60*Math.cos(t*.3),700,c1,.26);blob(900+60*Math.cos(t*.35),500+80*Math.sin(t*.45),640,c2,.2);x.restore();
 x.save();x.globalAlpha=.14;x.strokeStyle=A;x.lineWidth=1.2;const hz=1440;
 for(let i=-12;i<=12;i++){x.beginPath();x.moveTo(540+i*40,hz);x.lineTo(540+i*260,H);x.stroke()}
 for(let k=0;k<10;k++){const z=((k+t*.6)%10)/10;const y=hz+Math.pow(z,2.2)*(H-hz);x.globalAlpha=.14*z;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
 const fg=x.createLinearGradient(0,hz-10,0,hz+260);fg.addColorStop(0,'rgba(5,6,10,1)');fg.addColorStop(1,'rgba(5,6,10,0)');x.globalAlpha=1;x.fillStyle=fg;x.fillRect(0,hz-10,W,270);x.restore();
 x.save();for(let i=0;i<36;i++){const px=rnd(i)*W,py=(rnd(i+99)*H-t*(20+rnd(i+7)*40))%H;const yy=py<0?py+H:py;x.globalAlpha=.2+.3*rnd(i+3);x.fillStyle=[A,B,C][i%3];x.beginPath();x.arc(px,yy,1.5+rnd(i+5)*2,0,7);x.fill()}x.restore();
}
function bottomShade(y0,a=.92){const g=x.createLinearGradient(0,y0,0,H);g.addColorStop(0,'rgba(4,5,10,0)');g.addColorStop(.45,`rgba(4,5,10,${a*.8})`);g.addColorStop(1,`rgba(4,5,10,${a})`);x.fillStyle=g;x.fillRect(0,y0,W,H-y0)}
function topShade(y1,a=.85){const g=x.createLinearGradient(0,0,0,y1);g.addColorStop(0,`rgba(4,5,10,${a})`);g.addColorStop(1,'rgba(4,5,10,0)');x.fillStyle=g;x.fillRect(0,0,W,y1)}

// ---------- scenes ----------
const S=[0,3.4,7.6,12.0,15.8,20.0,24.2,27.4,32.4];
function s1(t){const a=0;
 photo(IMG.hero,t,0,S[1]+.3,540,635,1.0,1.08);
 topShade(420,.7);bottomShade(860,.97);
 // focus lock on glasses
 const fp=e5(P(t,a+.2,a+.9));if(fp>0){const k=lerp(1.5,1,fp);brackets(540-470*k,635-190*k,540+470*k,635+190*k,44,A,4,fp*(t<1.6||Math.floor(t*10)%2?1:.4))}
 kick('VISION OS · SMART GLASSES',1180,t,a+.15);
 rise('ΤΑ ΓΥΑΛΙΑ ΣΟΥ',1320,t,a+.2,92,{w:700});
 slam('ΤΡΑΒΑΝΕ',1490,t,a+.6,180,{g:1,glow:'rgba(139,92,255,.6)'});
 slam('ΒΙΝΤΕΟ.',1670,t,a+.9,180,{g:1,bar:A,glow:'rgba(53,208,255,.5)'});
}
function s2(t){const a=S[1],fl=1180;
 studio(t,fl,3);
 const pin=e5(P(t,a,a+1.1));
 const r=product(IMG.front,[29,188,1247,568],540,fl,lerp(1300,940,pin),t,{sweep:P(t,a+1.1,a+2.1),a:cl(pin*2)});
 // lens lock-on
 const lx=r.left+86*r.s*(r.ww/(IMG.front.width*r.s)),ly=r.top+268*r.s;const lp=e4(P(t,a+1.3,a+2));
 if(lp>0){ring(lx,ly,lerp(140,46,lp),lp,A,3);ring(lx,ly,lerp(170,62,lp),lp*.5,C,1.5);
  const q=e4(P(t,a+1.8,a+2.4));x.save();x.globalAlpha=q;x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=2;x.beginPath();x.moveTo(lx,ly-62);x.lineTo(lx,ly-62-150*q);x.lineTo(lx+120*q,ly-212);x.stroke();x.restore();
  if(q>0){txt(scr('CAMERA',q,5),lx+136,ly-222,'Michroma',26,{align:'left',ls:6,col:A,glow:A,gb:10,a:q});txt('Photo · Video',lx+136,ly-180,'Play',30,{align:'left',col:DIM,a:q})}}
 kick('BUILT-IN CAMERA',300,t,a+.25,C);
 rise('ΚΑΜΕΡΑ ΣΤΟΝ',420,t,a+.3,96,{w:700});
 slam('ΣΚΕΛΕΤΟ',590,t,a+.7,170,{g:1,bar:B});
 const sp=e4(P(t,a+2.2,a+2.9));if(sp>0)txt('Φωτογραφίες & βίντεο, χωρίς χέρια.',540,1520+(1-sp)*20,'Play',46,{w:700,a:sp,col:'#dfe3f5'});
}
function s3(t){const a=S[2];
 techbg(t,A,C);
 kick('A DAY WITH INNOMETRICS',300,t,a+.2,A,22);
 rise('ΜΙΑ ΜΕΡΑ ΜΑΖΙ ΤΟΥΣ',405,t,a+.25,80);
 const lp=eio(P(t,a+.4,a+2.6));x.save();const lg=x.createLinearGradient(0,520,0,1620);lg.addColorStop(0,A);lg.addColorStop(.5,B);lg.addColorStop(1,C);
 x.fillStyle=lg;x.shadowColor=B;x.shadowBlur=14;x.fillRect(150,520,4,1100*lp);x.restore();
 const items=[['08:00','Podcast στη διαδρομή','Ήχος ανοιχτού τύπου, χωρίς ακουστικά.',A,'note'],
  ['13:00','Κλήση εν κινήσει','Χέρια ελεύθερα, καθαρή φωνή.',B,'phone'],
  ['18:30','Βίντεο από τη βόλτα','Τραβάς ό,τι βλέπεις, με ένα πάτημα.',C,'cam'],
  ['21:00','Μενού στα γαλλικά;','Το μεταφράζουν για σένα.',A,'chat']];
 items.forEach(([tm,h,s,col,ic],i)=>{const t0=a+.6+i*.7,p=e5(P(t,t0,t0+.6));if(p<=0)return;const Y=610+i*275;
  x.save();x.globalAlpha=p;x.translate((1-p)*-80,0);
  ring(152,Y,16,1,col,4);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=20;x.beginPath();x.arc(152,Y,7,0,7);x.fill();x.shadowBlur=0;
  txt(tm,210,Y-32,'Michroma',28,{align:'left',ls:6,col,glow:col,gb:8});
  txt(h,210,Y+36,'Tektur',58,{align:'left',w:700});
  txt(s,210,Y+90,'Play',34,{align:'left',col:DIM});
