<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Michroma;src:url(fonts/Michroma.ttf)}
@font-face{font-family:InterX;src:url(fonts/Inter-ExtraBold.otf);font-weight:800}
@font-face{font-family:InterX;src:url(fonts/Inter-Bold.otf);font-weight:700}
@font-face{font-family:InterX;src:url(fonts/Inter-Medium.otf);font-weight:500}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const A='#35d0ff',B='#8b5cff',C='#f046d6',FG='#f4f6fb',DIM='#8a90a6';
const IMG={};
function load(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.src=src})}
window.ready=Promise.all([load('front','front.png'),load('temple','temple.png'),load('logo','logo.png'),load('hero','hero.png'),
 document.fonts.load('40px Michroma'),document.fonts.load('800 40px InterX'),document.fonts.load('700 40px InterX'),document.fonts.load('500 40px InterX')]);

// ---------- utils ----------
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),P=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3),e4=p=>1-Math.pow(1-p,4),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rnd(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+<>/';
function scr(str,p,seed){let r='';const n=str.length;for(let i=0;i<n;i++){const ch=str[i];r+=(ch===' '||i<p*n)?ch:GL[Math.floor(rnd(seed*31+i*7+Math.floor(p*40))*GL.length)]}return r}
function grad(x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,A);g.addColorStop(.5,B);g.addColorStop(1,C);return g}
function font(f,size,w=''){x.font=`${w} ${size}px ${f}`}
function txt(s,X,Y,f,size,o={}){x.save();font(f,size,o.w||'');x.textAlign=o.align||'center';x.letterSpacing=(o.ls||0)+'px';
 x.globalAlpha=o.a??1;x.fillStyle=o.col||FG;if(o.glow){x.shadowColor=o.glow;x.shadowBlur=o.gb||24}if(o.blur)x.filter=`blur(${o.blur}px)`;x.fillText(s,X,Y);x.restore()}
function fitSize(s,f,size,w,maxW,ls=0){font(f,size,w);x.letterSpacing=ls+'px';const m=x.measureText(s).width;return m>maxW?size*maxW/m:size}
// kicker: scrambled Michroma label
function kick(s,Y,t,t0,col=A,size=26){const p=P(t,t0,t0+.65);if(t<t0)return;txt(scr(s,p,Y),540,Y,'Michroma',size,{ls:size*.45,col,a:cl((t-t0)*3),glow:col,gb:12})}
// kinetic chars rising
function rise(s,Y,t,t0,size,o={}){const f=o.f||'InterX',w=o.w||800;font(f,size,w);x.letterSpacing='0px';
 const ls=o.ls??-size*.03;const ws=[...s].map(ch=>x.measureText(ch).width+ls);const tot=ws.reduce((a,b)=>a+b,0)-ls;let X=540-tot/2;
 x.save();x.beginPath();x.rect(0,Y-size*1.05,W,size*1.35);x.clip();
 [...s].forEach((ch,i)=>{const p=P(t,t0+i*.05,t0+i*.05+.7);if(p>0){const e=e4(p);x.save();x.translate(X+ws[i]/2,Y);x.scale(1,lerp(.3,1,e));x.globalAlpha=e;
  x.filter=`blur(${(1-e)*10}px)`;font(f,size,w);x.textAlign='center';x.fillStyle=o.col||(o.g?grad(-tot/2+540-X-ws[i]/2,0,tot/2+540-X-ws[i]/2,0):FG);
  if(o.glow){x.shadowColor=o.glow;x.shadowBlur=30}x.fillText(ch,0,(1-e)*size*1.1);x.restore()}X+=ws[i]});x.restore()}
// slam word with colour bar
function slam(s,Y,t,t0,size,o={}){if(t<t0)return;const f=o.f||'InterX',w=o.w||800;size=fitSize(s,f,size,w,o.maxW||960,-size*.04);
 font(f,size,w);x.letterSpacing=(-size*.04)+'px';const tw=x.measureText(s).width;const X0=540-tw/2-20,bw=tw+40,top=Y-size*.86,bh=size*1.02;
 const pb=P(t,t0,t0+.7);const ps=P(t,t0+.3,t0+.85);
 if(ps>0){x.save();x.beginPath();x.rect(X0-10,top-20,bw+20,bh+40);x.clip();
  const e=ps<1?(ps<.6?ps/.6:1):1;const k=ps;let ty=(1-e4(k))*bh*1.05,sx=lerp(1.3,1,e4(k)),sy=lerp(.7,1,e4(k));
  x.translate(540,Y+ty);x.scale(sx,sy);x.filter=`blur(${(1-e4(k))*10}px)`;x.textAlign='center';x.fillStyle=o.g?grad(-tw/2,0,tw/2,0):(o.col||FG);
  if(o.glow){x.shadowColor=o.glow;x.shadowBlur=36}x.fillText(s,0,0);x.restore()}
 if(pb>0&&pb<1){const q=eio(pb);let a0,a1;if(q<.5){a0=0;a1=q*2}else{a0=(q-.5)*2;a1=1}x.fillStyle=o.bar||C;x.fillRect(X0+bw*a0,top,bw*(a1-a0),bh)}}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function glass(X,Y,w,h,r,a=1,stroke='rgba(255,255,255,.22)'){x.save();x.globalAlpha=a;rr(X,Y,w,h,r);x.fillStyle='rgba(255,255,255,.06)';x.fill();x.strokeStyle=stroke;x.lineWidth=2;x.stroke();x.restore()}
function ring(cx,cy,r,a,col=A,lw=3){if(r<=0||a<=0)return;x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=lw;x.shadowColor=col;x.shadowBlur=18;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.restore()}
function img(im,cx,cy,w,o={}){const h=im.height*w/im.width;x.save();x.globalAlpha=o.a??1;if(o.blur)x.filter=`blur(${o.blur}px)`;x.translate(cx,cy);if(o.rot)x.rotate(o.rot);
 x.shadowColor=o.gc||'rgba(139,92,255,.55)';x.shadowBlur=o.gb??60;x.drawImage(im,-w/2,-h/2,w,h);x.restore();return h}
// stroke-draw path
function drawPath(fn,p,col,lw=5){if(p<=0)return;x.save();x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor=col;x.shadowBlur=16;
 x.setLineDash([1000,1000]);x.lineDashOffset=1000*(1-p);x.beginPath();fn();x.stroke();x.restore()}

// ---------- background ----------
const grains=[];for(let g=0;g<4;g++){const gc=document.createElement('canvas');gc.width=540;gc.height=960;const gx=gc.getContext('2d');const d=gx.createImageData(540,960);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=20}gx.putImageData(d,0,0);grains.push(gc)}
const MOOD=[[A,B],[B,A],[A,C],[B,C],[C,B],[A,B],[B,C]];
function bg(t,si,sp){
 const rg=x.createRadialGradient(540,1950,0,540,1950,1700);rg.addColorStop(0,'#1b0b4a');rg.addColorStop(.55,'#08070f');rg.addColorStop(1,'#05060a');x.fillStyle=rg;x.fillRect(0,0,W,H);
 const [c1,c2]=MOOD[si];x.save();x.globalCompositeOperation='screen';
 const blob=(X,Y,r,col,a)=>{const g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,col+Math.round(a*255).toString(16).padStart(2,'0'));g.addColorStop(1,col+'00');x.fillStyle=g;x.fillRect(0,0,W,H)};
 blob(180+80*Math.sin(t*.4),1450+60*Math.cos(t*.3),700,c1,.30);blob(900+60*Math.cos(t*.35),500+80*Math.sin(t*.45),640,c2,.22);x.restore();
 // perspective grid floor
 x.save();x.globalAlpha=.16;x.strokeStyle=A;x.lineWidth=1.2;const hz=1420;
 for(let i=-12;i<=12;i++){x.beginPath();x.moveTo(540+i*40,hz);x.lineTo(540+i*260,H);x.stroke()}
 for(let k=0;k<10;k++){const z=((k+t*.6)%10)/10;const y=hz+Math.pow(z,2.2)*(H-hz);x.globalAlpha=.16*z;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
 const fg=x.createLinearGradient(0,hz-10,0,hz+260);fg.addColorStop(0,'rgba(5,6,10,1)');fg.addColorStop(1,'rgba(5,6,10,0)');x.globalAlpha=1;x.fillStyle=fg;x.fillRect(0,hz-10,W,270);x.restore();
 // particles
 x.save();for(let i=0;i<40;i++){const px=rnd(i)*W,py=(rnd(i+99)*H-t*(20+rnd(i+7)*40))%H;const yy=py<0?py+H:py;x.globalAlpha=.25+.35*rnd(i+3);x.fillStyle=[A,B,C][i%3];x.beginPath();x.arc(px,yy,1.5+rnd(i+5)*2,0,7);x.fill()}x.restore();
}
function overlayFX(t){
 const v=x.createRadialGradient(540,960,500,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=v;x.fillRect(0,0,W,H);
 x.save();x.globalAlpha=.05;x.fillStyle='#fff';for(let y=0;y<H;y+=4)x.fillRect(0,y,W,1);x.restore();
 x.save();x.globalCompositeOperation='overlay';x.drawImage(grains[Math.floor(t*30)%4],0,0,W,H);x.restore();
}
// ---------- HUD ----------
const S=[0,3.6,8.4,12.6,17.0,21.4,25.0,30.5];
function hud(t){const a=cl(t*2.5)*(1-P(t,S[7]-.6,S[7]));if(a<=0)return;x.save();x.globalAlpha=a;
 txt('INNOMETRICS',60,92,'Michroma',22,{align:'left',ls:8,col:DIM});
 const s=Math.floor(t),f=Math.floor((t%1)*30);txt('00:00:'+String(s).padStart(2,'0')+':'+String(f).padStart(2,'0'),1020,92,'Michroma',22,{align:'right',ls:4,col:DIM});
 if(Math.floor(t*2)%2===0){x.fillStyle='#ff3b4d';x.shadowColor='#ff3b4d';x.shadowBlur=14;x.beginPath();x.arc(640,84,9,0,7);x.fill();x.shadowBlur=0}
 txt('REC',658,92,'Michroma',22,{align:'left',ls:4,col:'#ff6b7a'});
 // corner brackets
 x.strokeStyle=A;x.lineWidth=4;x.shadowColor=A;x.shadowBlur=10;const L=46,m=40,top=130,bot=1800;
 [[m,top,1,1],[W-m,top,-1,1],[m,bot,1,-1],[W-m,bot,-1,-1]].forEach(([px,py,dx,dy])=>{x.beginPath();x.moveTo(px,py+dy*L);x.lineTo(px,py);x.lineTo(px+dx*L,py);x.stroke()});
 x.shadowBlur=0;
 // segments
 const n=S.length-1,gap=10,sw=(W-120-gap*(n-1))/n;for(let i=0;i<n;i++){const X=60+i*(sw+gap);x.fillStyle='rgba(255,255,255,.14)';rr(X,1850,sw,6,3);x.fill();
  const p=P(t,S[i],S[i+1]);if(p>0){x.fillStyle=FG;rr(X,1850,sw*p,6,3);x.fill()}}
 x.restore()}
// ---------- transitions ----------
function wipe(t){for(let i=1;i<S.length-1;i++){const p=P(t,S[i]-.5,S[i]+.55);if(p<=0||p>=1)continue;const k=(i-1)%3;x.save();
 if(k===0){x.translate(540,960);x.rotate(-8*Math.PI/180);x.scale(1.45,1.45);x.translate(-540,-960);
  for(let j=0;j<5;j++){const q=P(p,j*.06,j*.06+.7);let tx;if(q<.42)tx=lerp(-1.05,0,eio(q/.42));else if(q<.58)tx=0;else tx=lerp(0,1.05,eio((q-.58)/.42));
   const g=x.createLinearGradient(0,0,W,0);const cols=j===4?['#fff3d6','#f2c882']:(j%2?[C,B]:[B,A]);g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
   x.fillStyle=g;x.fillRect(tx*W,j*H*.195,W,H*.21)}}
 else if(k===1){let r,a=1;if(p<.45)r=eio(p/.45)*1300;else{r=1300;a=p<.6?1:1-(p-.6)/.4}x.globalAlpha=a;
  const g=x.createRadialGradient(540,960,0,540,960,1300);g.addColorStop(0,A);g.addColorStop(.45,B);g.addColorStop(.8,'#14093a');x.fillStyle=g;x.beginPath();x.arc(540,960,r,0,7);x.fill()}
 else{const n=8,sw=W/n;for(let j=0;j<n;j++){const q=P(p,j*.04,j*.04+.72);let y0,y1;if(q<.46){y0=0;y1=eio(q/.46)}else{y0=eio((q-.46)/.54);y1=1}
   const g=x.createLinearGradient(0,0,0,H);if(j%2){g.addColorStop(0,'#0a1a3a');g.addColorStop(.5,A);g.addColorStop(1,B)}else{g.addColorStop(0,'#14093a');g.addColorStop(.5,B);g.addColorStop(1,C)}
   x.fillStyle=g;x.fillRect(j*sw-1,y0*H-20,sw+2,(y1-y0)*H+40)}}
 x.restore()}}

// ---------- scenes ----------
function s1(t){const a=0;
 kick('VISION OS · SMART GLASSES',560,t,a+.1);
 rise('ΤΑ ΓΥΑΛΙΑ ΣΟΥ',760,t,a+.15,104);
 slam('ΤΡΑΒΑΝΕ',940,t,a+.7,190,{g:1,glow:'rgba(139,92,255,.6)'});
 slam('ΒΙΝΤΕΟ.',1130,t,a+1.05,190,{g:1,bar:A,glow:'rgba(53,208,255,.5)'});
 const p=e4(P(t,a+1.4,a+2.4));if(p>0)img(IMG.front,540,1420+Math.sin(t*1.5)*8,lerp(600,820,p),{a:p,blur:(1-p)*14});
 // sweep
 const sp=P(t,a+1.6,a+2.8);if(sp>0&&sp<1){x.save();x.translate(lerp(-500,1600,eio(sp)),0);x.transform(1,0,-.32,1,0,0);const g=x.createLinearGradient(-160,0,160,0);
  g.addColorStop(0,'rgba(0,229,192,0)');g.addColorStop(.5,'rgba(0,229,192,.28)');g.addColorStop(1,'rgba(0,229,192,0)');x.fillStyle=g;x.fillRect(-160,0,320,H);x.restore()}
 const k2=P(t,a+2.1,a+2.8);if(k2>0)txt('Δες τι μπορούν να κάνουν ↓',540,1690,'InterX',36,{w:500,col:DIM,a:k2,ls:2});
}
function s2(t){const a=S[1];
 kick('A DAY WITH INNOMETRICS',300,t,a+.2,A,24);
 rise('ΜΙΑ ΜΕΡΑ ΜΑΖΙ ΤΟΥΣ',400,t,a+.3,78);
 const lp=eio(P(t,a+.5,a+2.6));x.save();const lg=x.createLinearGradient(0,520,0,1600);lg.addColorStop(0,A);lg.addColorStop(.5,B);lg.addColorStop(1,C);
 x.fillStyle=lg;x.shadowColor=B;x.shadowBlur=14;x.fillRect(150,520,4,1080*lp);x.restore();
 const items=[['08:00','Podcast στη διαδρομή','Ήχος ανοιχτού τύπου, χωρίς ακουστικά.',A,'note'],
  ['13:00','Κλήση εν κινήσει','Χέρια ελεύθερα, καθαρή φωνή.',B,'phone'],
  ['18:30','Βίντεο από τη βόλτα','Τραβάς ό,τι βλέπεις, με ένα πάτημα.',C,'cam'],
  ['21:00','Μενού στα γαλλικά;','Το μεταφράζουν για σένα.',A,'chat']];
 items.forEach(([tm,h,s,col,ic],i)=>{const t0=a+.8+i*.75,p=e4(P(t,t0,t0+.7));if(p<=0)return;const Y=600+i*270;
  x.save();x.globalAlpha=p;x.translate((1-p)*-60,0);
  ring(152,Y,16,1,col,4);x.fillStyle=col;x.shadowColor=col;x.shadowBlur=20;x.beginPath();x.arc(152,Y,7,0,7);x.fill();x.shadowBlur=0;
  txt(tm,210,Y-30,'Michroma',30,{align:'left',ls:6,col});
  txt(h,210,Y+36,'InterX',56,{align:'left',w:700,ls:-1});
  txt(s,210,Y+92,'InterX',34,{align:'left',w:500,col:DIM});
  x.restore();
  // icon
  const ip=P(t,t0+.25,t0+1.2);const ix=950,iy=Y+20;x.save();x.globalAlpha=p;glass(ix-62,iy-62,124,124,30,1);x.restore();
  drawPath(()=>{if(ic==='note'){x.moveTo(ix-14,iy+22);x.lineTo(ix-14,iy-26);x.lineTo(ix+22,iy-34);x.lineTo(ix+22,iy+14);x.moveTo(ix-14,iy+22);x.arc(ix-24,iy+22,10,0,6.3);x.moveTo(ix+22,iy+14);x.arc(ix+12,iy+14,10,0,6.3)}
   else if(ic==='phone'){x.moveTo(ix-26,iy-30);x.quadraticCurveTo(ix-36,iy+8,ix+2,iy+32);x.lineTo(ix+22,iy+28);x.lineTo(ix+16,iy+10);x.lineTo(ix+2,iy+12);x.quadraticCurveTo(ix-12,iy,ix-12,iy-12);x.lineTo(ix-6,iy-24);x.lineTo(ix-20,iy-36);x.closePath()}
   else if(ic==='cam'){x.roundRect(ix-36,iy-22,72,50,10);x.moveTo(ix+14,iy+3);x.arc(ix,iy+3,14,0,6.3);x.moveTo(ix-14,iy-22);x.lineTo(ix-8,iy-32);x.lineTo(ix+8,iy-32);x.lineTo(ix+14,iy-22)}
   else{x.roundRect(ix-36,iy-30,72,48,14);x.moveTo(ix-14,iy+18);x.lineTo(ix-22,iy+34);x.lineTo(ix+2,iy+18);x.moveTo(ix-18,iy-10);x.lineTo(ix+18,iy-10);x.moveTo(ix-18,iy+2);x.lineTo(ix+8,iy+2)}},ip,col,4);
 });
}
function s3(t){const a=S[2];
 const p=e4(P(t,a+.4,a+1.5));const sc=1.3;
 x.save();x.globalAlpha=p;x.filter=`blur(${(1-p)*12}px)`;x.shadowColor='rgba(139,92,255,.6)';x.shadowBlur=60;
 x.drawImage(IMG.temple,-320+(1-p)*-120,149+330,960*sc,1280*sc);x.restore();
 kick('ONE TAP',300,t,a+.2,C,24);
 rise('ΟΛΑ ΜΕ ΕΝΑ',400,t,a+.3,92);
 slam('ΑΓΓΙΓΜΑ',540,t,a+.75,140,{g:1,bar:B});

 const pts=[[343,760+330,'AI','Ο βοηθός σου,','με ένα πάτημα.',A],[346,1072+330,'PHOTO · VIDEO','Το κουμπί λήψης,','πάντα στο χέρι σου.',C]];
 pts.forEach(([px,py,lab,l1,l2,col],k)=>{const t0=a+1.4+k*.5;const dp=P(t,t0,t0+.4),lp=eio(P(t,t0+.2,t0+.8)),tp=P(t,t0+.6,t0+1.2);
  if(dp>0){x.save();x.globalAlpha=dp;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=20;x.beginPath();x.arc(px,py,10,0,7);x.fill();
   ring(px,py,18+6*Math.sin(t*4),.6,col,3);x.restore()}
  if(lp>0){x.save();x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=2;x.beginPath();x.moveTo(px+20,py);const ex2=lerp(px+20,620,lp);x.lineTo(ex2,py);x.stroke();x.restore()}
  if(tp>0){const e=e4(tp);x.save();x.globalAlpha=e;x.translate((1-e)*30,0);
   txt(lab,640,py-14,'Michroma',28,{align:'left',ls:5,col,glow:col,gb:10});txt(l1,640,py+40,'InterX',40,{align:'left',w:700});txt(l2,640,py+88,'InterX',40,{align:'left',w:700,col:'#cfd3e6'});x.restore()}
 });
 const fp=P(t,a+2.8,a+3.5);if(fp>0){x.save();x.globalAlpha=fp;glass(600,1620,400,84,42,1,'rgba(53,208,255,.6)');txt('+ Σύρε για ένταση',800,1675,'InterX',34,{w:700,col:A});x.restore()}
}
function s4(t){const a=S[3];
 kick('AI RECOGNITION',300,t,a+.2,A,24);
 rise('ΞΕΡΟΥΝ ΤΙ ΒΛΕΠΕΙΣ',400,t,a+.3,82);
 const p=e4(P(t,a+.35,a+1.2));const X0=60,Y0=480,PW=960,PH=1060;
 x.save();x.globalAlpha=p;x.translate(540,Y0+PH/2);x.scale(lerp(.9,1,p),lerp(.9,1,p));x.translate(-540,-(Y0+PH/2));
 rr(X0,Y0,PW,PH,40);x.save();x.clip();const s=Math.max(PW/IMG.hero.width,PH/IMG.hero.height);const iw=IMG.hero.width*s,ih=IMG.hero.height*s;
 const zz=lerp(1,1.06,P(t,a,S[4]));x.translate(540,Y0+PH/2);x.scale(zz,zz);x.translate(-540,-(Y0+PH/2));
 x.filter='brightness(.72) contrast(1.15) saturate(.8)';x.drawImage(IMG.hero,X0+(PW-iw)/2,Y0+(PH-ih)/2,iw,ih);x.filter='none';
 // scan line
 const sl=((t-a)*.55)%1;const sy=Y0+sl*PH;const sg=x.createLinearGradient(0,sy-60,0,sy);sg.addColorStop(0,'rgba(53,208,255,0)');sg.addColorStop(1,'rgba(53,208,255,.35)');x.fillStyle=sg;x.fillRect(X0,sy-60,PW,60);
