<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok connected</title><style>:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--acc:#0b6bcb}@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#aaa;--acc:#6fb3ff}}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:32px 16px}a{color:var(--acc)}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}small,.mut{color:var(--mut)}h1{line-height:1.2}</style></head><body><main><nav><a href="./">Home</a><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></nav>
<h1>TikTok login</h1>
<div id="r"><p>Waiting for TikTok…</p></div>
<script>
const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error'),r=document.getElementById('r');
if(c){r.innerHTML='<p>✅ TikTok account connected to InnoMetrics Posting.</p><p>Copy this code and give it to the setup assistant. It works only once and expires in a few minutes.</p><pre id="c" style="white-space:pre-wrap;word-break:break-all;padding:12px;border:1px solid #888;border-radius:8px"></pre><button id="b">Copy code</button>';document.getElementById('c').textContent=c;document.getElementById('b').onclick=()=>navigator.clipboard.writeText(c).then(()=>{document.getElementById('b').textContent='Copied ✓'});}
else if(e){r.textContent='Login was not completed: '+(p.get('error_description')||e);}
else{r.innerHTML='<p>This page receives the result after logging in to TikTok with InnoMetrics Posting.</p>';}
</script>
<hr><small>© 2026 InnoMetrics · Greece</small></main></body></html>
